    <rect x="80" y="-12" width="400" height="30" rx="15" fill="#fff" stroke="#e3e8f3"/>
    <text x="280" y="8" text-anchor="middle" fill="#647089" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">request -> route -> controller -> blade -> response</text>
  </g>
  <g transform="translate(418 66)">
    <rect x="-72" y="-28" width="144" height="56" rx="18" fill="url(#accent)"/>
    <text y="8" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Laravel Lab</text>
  </g>
